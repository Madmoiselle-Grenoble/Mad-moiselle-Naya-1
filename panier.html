<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement annulé — Mad'moiselle by Naya Délice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17140F; --gold:#C9A227; --gold-light:#E4C868;
    --cream:#F5EEDD; --brick:#97402B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:440px; width:100%; text-align:center;
    background:rgba(245,238,221,0.03);
    border:1px solid rgba(151,64,43,0.4);
    border-radius:8px; padding:52px 40px;
  }
  h1{ font-family:'Fraunces',serif; font-size:1.7rem; margin-bottom:14px; }
  p{ opacity:0.78; font-size:0.94rem; line-height:1.7; margin-bottom:8px; }
  .btn{
    display:inline-block; margin-top:26px;
    background:var(--gold); color:var(--ink);
    padding:13px 26px; border-radius:2px; text-decoration:none;
    font-family:'Space Mono',monospace; font-size:0.82rem; font-weight:700;
    letter-spacing:0.03em;
  }
  .btn:hover{ background:var(--gold-light); }
</style>
</head>
<body>
  <div class="card">
    <h1>Paiement annulé</h1>
    <p>Votre commande n'a pas été validée et aucun montant n'a été débité.</p>
    <p>Votre panier vous attend toujours si vous souhaitez réessayer.</p>
    <a class="btn" href="/">Retour à la boutique</a>
  </div>
</body>
</html>
