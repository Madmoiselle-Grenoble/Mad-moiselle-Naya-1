<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande confirmée — Mad'moiselle by Naya Délice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17140F; --gold:#C9A227; --gold-light:#E4C868;
    --cream:#F5EEDD; --paper:#FAF6EC; --brick:#97402B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:480px; width:100%; text-align:center;
    background:rgba(245,238,221,0.03);
    border:1px solid rgba(201,162,39,0.3);
    border-radius:8px; padding:56px 40px;
  }
  .stamp{
    width:100px; height:100px; margin:0 auto 26px;
    border:2px dashed var(--gold); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-6deg);
    font-family:'Space Mono',monospace; font-size:0.75rem; letter-spacing:0.06em;
    color:var(--gold-light);
  }
  h1{ font-family:'Fraunces',serif; font-size:1.9rem; margin-bottom:14px; }
  p{ opacity:0.78; font-size:0.95rem; line-height:1.7; margin-bottom:8px; }
  .ref{
    font-family:'Space Mono',monospace; font-size:0.8rem; color:var(--gold);
    margin:22px 0; padding:12px; border-top:1px solid rgba(245,238,221,0.15);
    border-bottom:1px solid rgba(245,238,221,0.15);
  }
  .btn{
    display:inline-block; margin-top:26px;
    background:var(--gold); color:var(--ink);
    padding:13px 26px; border-radius:2px; text-decoration:none;
    font-family:'Space Mono',monospace; font-size:0.82rem; font-weight:700;
    letter-spacing:0.03em;
  }
  .btn:hover{ background:var(--gold-light); }
</style>
</head>
<body>
  <div class="card">
    <div class="stamp">VALIDÉ<br>✓</div>
    <h1>Commande confirmée</h1>
    <p>Merci pour votre commande ! Un e-mail de confirmation vous a été envoyé par Stripe.</p>
    <p>Retrait gratuit au Marché des Ayguinards (Meylan) ou livraison en 48h partout en France, selon le mode choisi au paiement.</p>
    <div class="ref" id="refBox">Référence en cours de chargement…</div>
    <a class="btn" href="/">Retour à la boutique</a>
  </div>

<script>
  // La confirmation elle-même vient de Stripe (le paiement est déjà encaissé
  // au moment où le client arrive sur cette page). On affiche juste la
  // référence de session pour qu'il puisse la retrouver si besoin.
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  document.getElementById('refBox').textContent = sessionId
    ? 'Référence de commande : ' + sessionId
    : 'Référence de commande indisponible.';
</script>
</body>
</html>
